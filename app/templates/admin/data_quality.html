{% extends "base.html" %}
{% block content %}
<h1>Data Quality</h1>
<table class="table table-striped">
  <thead>
    <tr><th>Municipality</th><th>Completeness %</th><th>Last Submission</th><th>Duplicates</th><th>Invalid</th></tr>
  </thead>
  <tbody>
    {% for m in metrics %}
      <tr>
        <td>{{ m.municipality_id }}</td>
        <td>{{ m.completeness_pct }}</td>
        <td>{{ m.last_submission or 'N/A' }}</td>
        <td>{{ m.duplicates }}</td>
        <td>{{ m.invalid }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
