{% extends "base.html" %}
{% block content %}
<h1>Production Trends</h1>
<div class="row g-3 mb-4">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Production Over Time</h5>
        <canvas id="trendChart"></canvas>
      </div>
    </div>
  </div>
</div>
<div class="row g-3 mb-4">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Seasonal Patterns</h5>
        <canvas id="seasonalChart"></canvas>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: { labels: {{ trend_labels|tojson }}, datasets: {{ trend_datasets|tojson }} }
  });
  new Chart(document.getElementById('seasonalChart'), {
    type: 'bar',
    data: { labels: {{ seasonal_labels|tojson }}, datasets: [{ label: 'Avg Production', data: {{ seasonal_data|tojson }}, backgroundColor: '#0d6efd' }] }
  });
</script>
{% endblock %}
