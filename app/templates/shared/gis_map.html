{% extends "base.html" %}
{% block content %}
<h1>GIS Map</h1>
<div class="row">
  <div class="col-md-9">
    <div id="map" style="height: 600px;"></div>
  </div>
  <div class="col-md-3">
    <div class="card" id="detailPanel" style="display:none;">
      <div class="card-header">
        <h6 class="mb-0">Municipality Detail</h6>
      </div>
      <div class="card-body">
        <h5 id="detailName" class="card-title"></h5>
        <p><strong>Total Production:</strong> <span id="detailProduction"></span></p>
        <p><strong>Method Distribution:</strong> <span id="detailMethod"></span></p>
        <p><strong>Contribution:</strong> <span id="detailContribution"></span></p>
        <p><strong>Data Quality:</strong> <span id="detailQuality"></span></p>
        <p><strong>Forecast Readiness:</strong> <span id="detailForecast"></span></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([16.0, 120.0], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }).addTo(map);
  var data = {{ municipalities | tojson }};
  data.forEach(function(m) {
    var color = m.production > 100000 ? '#198754' : m.production > 50000 ? '#ffc107' : '#dc3545';
    var marker = L.circleMarker([m.lat, m.lng], { radius: 10, fillColor: color, color: '#000', weight: 1, opacity: 1, fillOpacity: 0.8 }).addTo(map);
    marker.bindPopup('<strong>' + m.name + '</strong><br>Production: ' + m.production + '<br>Records: ' + m.records_count);
    marker.on('click', function() {
      document.getElementById('detailPanel').style.display = 'block';
      document.getElementById('detailName').textContent = m.name;
      document.getElementById('detailProduction').textContent = m.production + ' kg';
      document.getElementById('detailMethod').textContent = m.method_distribution || 'N/A';
      document.getElementById('detailContribution').textContent = (m.contribution_pct || 0) + '%';
      document.getElementById('detailQuality').textContent = (m.data_quality_score || 0) + '%';
      document.getElementById('detailForecast').textContent = m.forecast_ready ? 'Ready' : 'Not Ready';
    });
  });
  {% if current_user.is_authenticated and current_user.role == 'admin' %}
  var adminControl = L.control({position: 'topright'});
  adminControl.onAdd = function(map) {
    var div = L.DomUtil.create('div', 'info legend');
    div.innerHTML = '<h4>Admin Controls</h4><button class="btn btn-sm btn-primary">Edit Boundaries</button>';
    return div;
  };
  adminControl.addTo(map);
  {% endif %}
</script>
{% endblock %}
