{% extends "base.html" %}
{% block content %}
<h1>Public Reports</h1>
{% if reports %}
  <table class="table table-striped">
    <thead>
      <tr><th>Type</th><th>Format</th><th>Generated</th><th>Action</th></tr>
    </thead>
    <tbody>
      {% for r in reports %}
        <tr>
          <td>{{ r.report_type }}</td>
          <td>{{ r.format }}</td>
          <td>{{ r.generated_at }}</td>
          <td><a href="{{ r.file_url or '#' }}" class="btn btn-sm btn-primary" target="_blank">Download</a></td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p class="text-muted">No public reports available yet.</p>
{% endif %}
{% endblock %}
