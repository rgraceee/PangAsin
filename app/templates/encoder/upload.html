{% extends "base.html" %}
{% block content %}
<h1>Upload Records</h1>
<div class="card">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {{ form.hidden_tag() }}
      <div class="mb-3">
        {{ form.file.label(class="form-label") }}
        {{ form.file(class="form-control") }}
      </div>
      <button type="submit" class="btn btn-primary">Upload</button>
    </form>
    <hr>
    <p><a href="#" class="btn btn-sm btn-outline-secondary">Download Template</a></p>
  </div>
</div>
{% endblock %}
